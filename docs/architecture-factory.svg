<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Agentic Code Factory — architecture</title>
  <desc>A manager agent on Google ADK and Gemini reads the build plan, delegates subtasks to engineers in isolated workspaces, and merges their work behind a forbidden-path gate and a retest. A dashboard reads the event log and git, and writes back what the human points at.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f7784"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6bcb"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e8a57"/></marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#161a20">Agentic Code Factory</text>
  <text x="24" y="48" font-size="12" fill="#5b6472">A manager agent turns a written build plan into parallel, test-gated work. Google services are named in each block.</text>

  <!-- input -->
  <rect x="24" y="72" width="238" height="66" rx="9" fill="#f6f7f9" stroke="#e0e4ea"/>
  <text x="38" y="94" font-size="12.5" font-weight="700" fill="#161a20">BUILDPLAN.md + opzet.json</text>
  <text x="38" y="112" font-size="11" fill="#5b6472">tasks from the plan, edges by hand</text>
  <text x="38" y="128" font-size="11" fill="#5b6472">the plan states one edge, humans the rest</text>

  <rect x="24" y="152" width="210" height="52" rx="9" fill="#f6f7f9" stroke="#e0e4ea"/>
  <text x="38" y="174" font-size="12.5" font-weight="700" fill="#161a20">config.json</text>
  <text x="38" y="192" font-size="11" fill="#5b6472">forbidden paths · tests per area</text>

  <!-- manager -->
  <rect x="288" y="72" width="266" height="132" rx="9" fill="#ffffff" stroke="#0b6bcb" stroke-width="1.6"/>
  <text x="304" y="96" font-size="13" font-weight="700" fill="#161a20">Manager — LlmAgent</text>
  <text x="304" y="115" font-size="11.5" fill="#0b6bcb">Google ADK 2.x · gemini-3.7-flash</text>
  <text x="304" y="133" font-size="11.5" fill="#0b6bcb">Gemini Enterprise Agent Platform</text>
  <text x="304" y="155" font-size="11" fill="#5b6472">six tools: read graph, read pointer,</text>
  <text x="304" y="170" font-size="11" fill="#5b6472">delegate, poll, merge, finish</text>
  <text x="304" y="192" font-size="11" fill="#161a20" font-weight="600">decides WHAT goes out — never IF a merge may land</text>

  <path d="M234,105 L284,105" stroke="#6f7784" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M234,178 C260,178 262,150 284,150" stroke="#6f7784" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- engineers -->
  <rect x="608" y="72" width="348" height="60" rx="9" fill="#ffffff" stroke="#e0e4ea"/>
  <text x="622" y="94" font-size="12.5" font-weight="700" fill="#161a20">Engineer — one role, two implementations</text>
  <text x="622" y="112" font-size="11" fill="#5b6472">in: task text, starting branch, forbidden list, test cmd</text>
  <text x="622" y="126" font-size="11" fill="#5b6472">out: a branch with commits, progress, an end signal</text>

  <rect x="608" y="142" width="168" height="76" rx="9" fill="#f6f7f9" stroke="#e0e4ea"/>
  <text x="622" y="164" font-size="12" font-weight="700" fill="#161a20">local agent</text>
  <text x="622" y="182" font-size="11" fill="#5b6472">git worktree per engineer</text>
  <text x="622" y="198" font-size="11" fill="#5b6472">runs the area's own tests</text>
  <text x="622" y="212" font-size="11" fill="#5b6472">used in the demo run</text>

  <rect x="780" y="142" width="176" height="76" rx="9" fill="#ffffff" stroke="#0b6bcb" stroke-width="1.6"/>
  <text x="792" y="164" font-size="12" font-weight="700" fill="#161a20">Jules session</text>
  <text x="792" y="182" font-size="11" fill="#0b6bcb">Google Jules API (alpha)</text>
  <text x="792" y="198" font-size="11" fill="#5b6472">own Cloud VM per task</text>
  <text x="792" y="212" font-size="11" fill="#c02b32">written, never executed</text>

  <path d="M554,102 L604,102" stroke="#6f7784" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="558" y="94" font-size="10" fill="#6f7784">delegate</text>

  <!-- gate -->
  <rect x="288" y="240" width="266" height="94" rx="9" fill="#ffffff" stroke="#c02b32" stroke-width="1.6"/>
  <text x="304" y="262" font-size="12.5" font-weight="700" fill="#c02b32">Gate — code, not prompt</text>
  <text x="304" y="281" font-size="11" fill="#5b6472">1 · forbidden paths, checked on the diff</text>
  <text x="304" y="297" font-size="11" fill="#5b6472">2 · merge --no-ff into the trial branch</text>
  <text x="304" y="313" font-size="11" fill="#5b6472">3 · retest AFTER the merge; red = revert</text>
  <text x="304" y="329" font-size="11" fill="#161a20" font-weight="600">one forbidden path ends the run</text>

  <path d="M690,218 C690,240 600,236 558,272" stroke="#6f7784" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="590" y="238" font-size="10" fill="#6f7784">branch + commits</text>

  <rect x="608" y="240" width="348" height="94" rx="9" fill="#ffffff" stroke="#0e8a57" stroke-width="1.6"/>
  <text x="622" y="262" font-size="12.5" font-weight="700" fill="#161a20">Event log — append-only JSONL</text>
  <text x="622" y="282" font-size="11.5" fill="#0b6bcb">▪ reported — what the agent says: rich, early, untrustworthy</text>
  <text x="622" y="300" font-size="11.5" fill="#0e8a57">▫ measured — what git says: thin, late, impossible to fake</text>
  <text x="622" y="322" font-size="11" fill="#5b6472">two of the warnings fire where these two disagree</text>

  <path d="M554,290 L604,290" stroke="#6f7784" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- dashboard -->
  <rect x="288" y="368" width="668" height="94" rx="9" fill="#ffffff" stroke="#0b6bcb" stroke-width="1.6"/>
  <text x="304" y="390" font-size="12.5" font-weight="700" fill="#161a20">Dashboard — local, 127.0.0.1, server-sent events</text>
  <text x="304" y="410" font-size="11" fill="#5b6472">build plan with the reason beside every blocked subtask · each engineer's measured git state</text>
  <text x="304" y="426" font-size="11" fill="#5b6472">warnings and alarms · the event log with its two sources</text>
  <text x="304" y="446" font-size="11" fill="#161a20" font-weight="600">point-at writes the next job; the manager reads it at the start of its next turn</text>

  <path d="M782,334 L782,364" stroke="#6f7784" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M288,410 C240,410 240,150 284,150" stroke="#0b6bcb" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="60" y="404" font-size="10.5" fill="#0b6bcb">what the human points at</text>

  <!-- output -->
  <rect x="24" y="240" width="238" height="94" rx="9" fill="#ffffff" stroke="#0e8a57" stroke-width="1.6"/>
  <text x="38" y="262" font-size="12.5" font-weight="700" fill="#161a20">Trial branch</text>
  <text x="38" y="281" font-size="11" fill="#5b6472">the only place work comes together</text>
  <text x="38" y="299" font-size="11" fill="#5b6472">graph updated, log line written</text>
  <text x="38" y="319" font-size="11" fill="#161a20" font-weight="600">no checkbox — that is a human&#8217;s job</text>
  <path d="M288,290 L240,290" stroke="#0e8a57" stroke-width="1.5" fill="none" marker-end="url(#c)"/>

  <text x="24" y="500" font-size="11" fill="#8b94a3">Demonstrated on Phase 7 of this repository's own backlog: five subtasks built, tested, merged and logged in under a minute.</text>
  <text x="24" y="518" font-size="11" fill="#8b94a3">Subtask 7.3 stays blocked throughout — it states a dependency on four subtasks outside the run, and the manager leaves it alone.</text>
</svg>
